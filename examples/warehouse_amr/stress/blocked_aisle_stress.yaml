# Stress campaign: where does the blocked-aisle behaviour break?
base: examples/warehouse_amr/scenarios/blocked_aisle.yaml
name: blocked_aisle_stress
runs: 20
seed: 1
vary:
  - {path: events.0.action.pose.x, uniform: [-3.2, -1.2]}        # where the pallet lands in the aisle
  - {path: events.0.trigger.radius_m, uniform: [0.3, 2.2]}        # how late it appears (bigger = earlier)
  - {path: events.0.action.pose.yaw, choice: [0.0, 0.785, 1.5708]} # partial vs full blockage
  - {path: navigation.overrides.controller_server.ros__parameters.FollowPath.vx_max, uniform: [0.3, 0.6]}
