schema_version: "0.1"
experiment:
  name: "impossible_route"
  description: "S3: goal fully enclosed, expected controlled FAIL"
  seed: 42
robot:
  profile: warehouse_amr_v1
world:
  id: qr_warehouse_small
navigation:
  stack: nav2
  parameter_profile: nav2_warehouse_v1
mission:
  start: station_a
  goal: station_c
  timeout_seconds: 90
metrics: [success, time_to_goal, path_length, path_efficiency, min_clearance, stopped_time, goal_error]
gates:
  success: {equals: true}
  min_clearance: {greater_than_m: 0.20, warn_below_m: 0.30}
  timeout: {less_than_seconds: 90}
events:
  - id: wall_north
    trigger: {type: elapsed_time, seconds: 0}
    action: {type: spawn_entity, asset: wall_1m, pose: {x: 5.0, y: 0.1}}
  - id: wall_south
    trigger: {type: elapsed_time, seconds: 0}
    action: {type: spawn_entity, asset: wall_1m, pose: {x: 5.0, y: -0.9}}
  - id: wall_east
    trigger: {type: elapsed_time, seconds: 0}
    action: {type: spawn_entity, asset: wall_1m, pose: {x: 5.5, y: -0.4, yaw: 1.5708}}
  - id: wall_west
    trigger: {type: elapsed_time, seconds: 0}
    action: {type: spawn_entity, asset: wall_1m, pose: {x: 4.5, y: -0.4, yaw: 1.5708}}
