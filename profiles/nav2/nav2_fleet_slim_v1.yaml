# Slim fleet profile for 10-robot runs on one desktop: nav2_warehouse_v2 plus lighter AMCL
# (fewer particles/beams), MPPI at 10 Hz (model_dt 0.1 s, 3 s horizon) with a smaller batch, lower costmap/planner rates.
# Used with simulation/launch/qr_bringup_slim.launch.py (fleet_policy.slim). All stacks of a
# 10-robot comparison use it.
id: nav2_fleet_slim_v1
source: nav2_bringup/params/nav2_params.yaml
overrides:
  amcl:
    ros__parameters:
      alpha1: 0.05
      alpha2: 0.05
      alpha3: 0.05
      alpha4: 0.05
      max_beams: 90
      update_min_d: 0.1
      update_min_a: 0.1
      z_hit: 0.7
      z_rand: 0.3
      max_particles: 600
      min_particles: 200
  controller_server:
    ros__parameters:
      controller_frequency: 10.0
      FollowPath:
        batch_size: 800
        time_steps: 30
        model_dt: 0.1
  planner_server:
    ros__parameters:
      expected_planner_frequency: 5.0
  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 4.0
        publish_frequency: 1.0
