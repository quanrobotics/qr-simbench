name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {python-version: ["3.10", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Validate example scenarios
        run: for f in examples/*/scenarios/*.yaml; do qrsimbench validate "$f"; done
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Every commit is signed off
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "commit $c is not signed off"; exit 1; }
          done
