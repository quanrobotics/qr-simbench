name: security
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "0 3 * * 1"}]
permissions: {contents: read, actions: read, security-events: write}
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Scan history for secrets (gitleaks CLI, no licence needed)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact -v
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: {languages: python}
      - uses: github/codeql-action/analyze@v4
