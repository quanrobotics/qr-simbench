schema_version: '0.1'
experiment:
  name: blocked_aisle
  description: 'S1: pallet appears ahead once the robot enters the aisle, expected
    PASS with degraded metrics'
  seed: 42
runtime:
  ros_distro: jazzy
  simulator: gazebo_harmonic
  headless: true
robot:
  profile: warehouse_amr_v1
world:
  id: qr_warehouse_small
navigation:
  stack: nav2
  parameter_profile: nav2_warehouse_v1
mission:
  start: station_a
  goal: station_c
  timeout_seconds: 180.0
  start_pose:
    x: -5.0
    y: 2.1
    z: 0.0
    yaw: 0.0
  goal_pose:
    x: 5.0
    y: -0.4
    z: 0.0
    yaw: 0.0
events:
- id: pallet_appears
  trigger:
    type: robot_near
    x: -4.3
    y: 2.1
    radius_m: 0.4
  action:
    type: spawn_entity
    asset: pallet
    pose:
      x: -2.4
      y: 2.1
      z: 0.0
      yaw: 1.5708
    name: null
recording:
  storage: mcap
  topics:
  - /tf
  - /tf_static
  - /odom
  - /scan
  - /cmd_vel
  - /plan
  - /amcl_pose
metrics:
- success
- time_to_goal
- path_length
- path_efficiency
- min_clearance
- stopped_time
- goal_error
gates:
  success:
    equals: true
    greater_than_m: null
    warn_below_m: null
    less_than_seconds: null
  min_clearance:
    equals: null
    greater_than_m: 0.2
    warn_below_m: 0.3
    less_than_seconds: null
  timeout:
    equals: null
    greater_than_m: null
    warn_below_m: null
    less_than_seconds: 180.0
resolved_profiles:
  robot:
    id: warehouse_amr_v1
    upstream_model: turtlebot3_waffle
    drive: differential
    footprint_radius_m: 0.22
    max_linear_speed_mps: 0.5
    max_angular_speed_rps: 1.82
    lidar:
      topic: /scan
      range_min_m: 0.12
      range_max_m: 3.5
    sim_robot_sdf: simulation/robots/gz_waffle_gt.sdf.xacro
