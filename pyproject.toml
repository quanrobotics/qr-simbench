[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsimbench"
version = "0.2.0"
description = "Scenario-to-Evidence Validation for Physical AI"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6",
  "mcap>=1.1",
  "mcap-ros2-support>=0.5",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "pyarrow>=15",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
qrsimbench = "qrsimbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
qrsimbench = ["reporting/templates/*", "reporting/viewer/*", "reporting/viewer/static/*", "reporting/viewer/static/vendor/three/*", "console/static/*"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
"src/qrsimbench/cli.py" = ["B008"]
"src/qrsimbench/console/app.py" = ["E501"]
"src/qrsimbench/console/studio.py" = ["E501"]
"src/qrsimbench/stress/*.py" = ["E501"]
"src/qrsimbench/baselines/*.py" = ["E501"]
"src/qrsimbench/runner/events.py" = ["E501"]
"src/qrsimbench/adapters/gazebo/actors.py" = ["E501"]
"tests/**/*.py" = ["E501"]
